# fly.toml app configuration file generated for cobertugo on 2024-02-11T11:29:26-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cobertugo'
primary_region = 'gdl'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 4
  memory_mb = 2048
